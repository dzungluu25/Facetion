[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "facetion"
dynamic = ["version"]
description = "Face recognition and hand-gesture computer control from your webcam, built on OpenCV."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "opencv-contrib-python>=4.5",
    "numpy",
]
keywords = [
    "face-recognition", "hand-tracking", "gesture-control", "opencv",
    "computer-vision", "webcam", "virtual-mouse",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.optional-dependencies]
control = ["pynput>=1.7"]
dev = ["pytest", "ruff"]

[project.scripts]
facetion = "facetion.__main__:main"

[project.urls]
Homepage = "https://github.com/dzungluu25/Facetion"
Issues = "https://github.com/dzungluu25/Facetion/issues"

[tool.setuptools.packages.find]
include = ["facetion*"]

[tool.setuptools.package-data]
facetion = ["models/*.xml"]

[tool.setuptools.dynamic]
version = { attr = "facetion.__version__" }

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E203"]

[tool.pytest.ini_options]
testpaths = ["tests"]
